name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        SCALA_VERSION: ["2.12.20", "2.13.16", "3.3.6"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.1
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    - name: Test
      run: ./mill -i '__[${{ matrix.SCALA_VERSION }}].test'

  bin-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.1
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    - name: Check
      run: ./mill -i __.mimaReportBinaryIssues

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.1
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
        apps: scalafmt:3.7.14
    - run: scalafmt --check

  doc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.1
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    - run: |
        .github/scripts/setup-mkdocs.sh && \
        ./mill -i docs.mkdocsBuild

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never publish to Sonatype Central from two jobs at a time (snapshots of successive pushes,
    # or a snapshot and a release). A job waits for the running one rather than cancelling it.
    # GitHub keeps only one waiting job per group though, and cancels an older waiting one.
    concurrency:
      group: sonatype-central-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_ARTIFACTS: __:PublishModule.publishArtifacts
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.1
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    - name: Release
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          # --shouldRelease false: the bundle is uploaded and validated on Sonatype Central, but has
          # to be published manually from https://central.sonatype.com/publishing/deployments
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --publishArtifacts "$PUBLISH_ARTIFACTS" --bundleName "case-app-${GITHUB_REF#refs/tags/v}" --shouldRelease false
        else
          for tag in $(git tag --points-at HEAD); do
            git tag -d "$tag"
          done
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --publishArtifacts "$PUBLISH_ARTIFACTS"
        fi
      env:
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    # Same artifacts, snapshots included, to GitHub Packages. Best effort: Sonatype Central is
    # the source of truth.
    - name: Publish to GitHub Packages
      continue-on-error: true
      run: |
        ./mill -i mill.javalib.MavenPublishModule/publishAll \
          --publishArtifacts "$PUBLISH_ARTIFACTS" \
          --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
          --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
      env:
        MILL_MAVEN_USERNAME: ${{ github.actor }}
        MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  update-website:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.1
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    - run: |
        .github/scripts/setup-mkdocs.sh && \
        ./mill -i docs.mkdocsGhDeploy
